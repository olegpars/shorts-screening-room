<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#f5f2ec"><title>Короткие истории</title><link rel="stylesheet" href="./style.css"><script defer src="./app.js"></script>
</head><body>
<header><div class="mast"><svg aria-hidden="true" viewBox="0 0 48 48"><path fill="#ef643b" d="M5 11h24v26H5z"/><path fill="#312c29" d="m29 18 14-7v26l-14-7z"/></svg><div><h1>Короткие истории</h1><p id="summary" role="status">Загружаются ролики</p></div></div></header>
<main>
<section class="controls" aria-label="Отбор роликов"><div class="row"><div class="search"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="10" cy="10" r="6.3"/><path d="m15 15 6 6"/></svg><input type="search" id="search" placeholder="Найти по названию" aria-label="Найти по названию"></div><button id="favFilter" aria-pressed="false"><span aria-hidden="true">♡</span> Избранное <b>0</b></button></div>
<div class="strip"><label for="collection">Подборка</label><select id="collection"><option value="">Все подборки</option></select></div></section>
<section id="cards" aria-label="Ролики"></section><section id="empty" hidden><h2>Совпадений пока нет</h2><button id="reset">Показать все ролики</button></section></main>
<dialog id="viewer" aria-labelledby="vtitle"><div class="viewerBody">
<div class="viewerHead"><div><div id="vcollection"></div><h2 id="vtitle"></h2></div><button aria-label="Закрыть просмотр" id="close">×</button></div>
<div class="screen"><video id="video" preload="metadata" controls playsinline></video></div>
<div class="viewerFoot"><button id="prev" aria-label="Предыдущий ролик">←</button><button id="save" aria-pressed="false">♡ В избранное</button><button id="next" aria-label="Следующий ролик">→</button></div><div class="position" id="position"></div></div></dialog>
</body></html>
